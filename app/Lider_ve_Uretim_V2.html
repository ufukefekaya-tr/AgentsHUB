<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ufuk Kaya - Üretimin Lideri</title>
    <style>
        body { margin: 0; background: #050507; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .canvas { position: relative; width: 900px; height: 550px; background: radial-gradient(circle at 30% 30%, #1a1a2e 0%, #050507 100%); border-radius: 15px; box-shadow: 0 0 60px rgba(0,0,0,0.9); border: 1px solid #16213e; overflow: hidden; }
        
        /* Arka Plan Fabrika Detayları */
        .grid { position: absolute; width: 200%; height: 200%; background-image: linear-gradient(rgba(72, 219, 251, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(72, 219, 251, 0.05) 1px, transparent 1px); background-size: 50px 50px; transform: perspective(500px) rotateX(60deg) translateY(-200px); opacity: 0.3; }

        /* Poşet Makinası (Gelişmiş Endüstriyel Tasarım) */
        .machine-complex { position: absolute; right: 40px; bottom: 40px; width: 450px; height: 380px; }
        .machine-body { position: absolute; bottom: 0; width: 100%; height: 320px; background: linear-gradient(135deg, #2d3436 0%, #000000 100%); border-radius: 8px; border-left: 10px solid #636e72; box-shadow: 20px 20px 40px rgba(0,0,0,0.6); }
        .roller { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 8px solid #b2bec3; background: repeating-conic-gradient(#636e72 0% 15%, #2d3436 15% 30%); animation: spin 3s linear infinite; }
        .roller-1 { top: -40px; left: 40px; }
        .roller-2 { top: 60px; right: -30px; width: 80px; height: 80px; animation-duration: 2s; }
        .plastic-sheet { position: absolute; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(2px); border: 1px solid rgba(255,255,255,0.1); }
        .sheet-1 { top: 20px; left: 100px; width: 250px; height: 180px; transform: skewY(-5deg); box-shadow: 0 0 20px rgba(0, 184, 148, 0.2); }

        /* Lider: Ufuk Kaya (Modern & Karizmatik Silüet) */
        .leader-container { position: absolute; left: 60px; bottom: 0; width: 350px; height: 500px; z-index: 10; }
        .suit-body { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 220px; height: 380px; background: #0c0c0c; border-radius: 60px 60px 0 0; border-top: 3px solid #48dbfb; box-shadow: 0 -10px 30px rgba(72, 219, 251, 0.2); }
        .head-area { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 90px; height: 120px; background: #1a1a1a; border-radius: 45% 45% 50% 50%; box-shadow: inset 0 0 15px #48dbfb22; }
        .glow-eyes { position: absolute; top: 55px; left: 20px; width: 50px; height: 4px; display: flex; justify-content: space-around; }
        .eye { width: 12px; height: 2px; background: #48dbfb; box-shadow: 0 0 10px #48dbfb; border-radius: 2px; opacity: 0.8; }

        /* Işık Oyunları */
        .cyan-flare { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(72, 219, 251, 0.1) 0%, transparent 70%); left: -150px; top: -100px; }
        .amber-flare { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(255, 159, 67, 0.08) 0%, transparent 70%); right: -100px; bottom: -100px; }

        /* Tipografi */
        .header { position: absolute; top: 50px; left: 60px; z-index: 20; }
        .name { font-size: 36px; font-weight: 900; letter-spacing: 5px; color: #fff; margin: 0; text-shadow: 0 0 20px rgba(72, 219, 251, 0.6); }
        .title { font-size: 14px; letter-spacing: 3px; color: #48dbfb; margin-top: 5px; text-transform: uppercase; font-weight: 300; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="canvas">
        <div class="cyan-flare"></div>
        <div class="amber-flare"></div>
        <div class="grid"></div>
        
        <div class="header">
            <h1 class="name">UFUK KAYA</h1>
            <div class="title">Endüstriyel Vizyoner & Sistem Mimarı</div>
        </div>

        <!-- Lider Figürü -->
        <div class="leader-container">
            <div class="head-area">
                <div class="glow-eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
            <div class="suit-body"></div>
        </div>

        <!-- Poşet Makinası Grubu -->
        <div class="machine-complex">
            <div class="machine-body">
                <div class="roller roller-1"></div>
                <div class="roller roller-2"></div>
                <div class="plastic-sheet sheet-1"></div>
                <!-- Kontrol Paneli -->
                <div style="position:absolute; bottom:40px; left:30px; width:60px; height:100px; background:#111; border:1px solid #444; border-radius:4px; display:flex; flex-direction:column; justify-content:space-around; align-items:center;">
                    <div style="width:15px; height:15px; border-radius:50%; background:#ff9f43; box-shadow:0 0 10px #ff9f43;"></div>
                    <div style="width:15px; height:15px; border-radius:50%; background:#00b894; box-shadow:0 0 10px #00b894;"></div>
                    <div style="width:20px; height:4px; background:#48dbfb;"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
